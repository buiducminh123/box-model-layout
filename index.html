<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Layout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>So sánh content-box và border-box</h1>

    <div class="container">
        <div class="card">
            <h3>Thẻ 1: content-box</h3>
            <p>Kích thước thật lớn hơn width và height đã khai báo.</p>
        </div>
        <div class="card">
            <h3>Thẻ 2: border-box</h3>
            <p>Kích thước thật đúng bằng width và height đã khai báo.</p>
        </div>
        <div class="card">
            <h3>Thẻ 3: border-box</h3>
            <p>Giống thẻ 2, chỉ khác màu nền.</p>
        </div>
    </div>
</body>

</html>
